# Add, remove, or reorder sources here.
# kind    = "hn" | "rss"        how the source is fetched (Algolia / feedparser)
# section = "Science & Maths"   which front-page column the source files under;
#                               sources sharing a section share a column, and
#                               the first four sections get the front page.
# medium  = "read"|"watch"|"listen"   what the reader does with it. Drives the
#                               glyph in the byline and the Read/Watch/Listen
#                               filter. Defaults to "read".
#
# Order matters twice over: sections appear in the order their first source
# does, and within a section the top article is the newest. Quality first,
# social last.

# World news (Wikipedia Current events) is rendered inline on page 1 from
# decorations — NOT configured here as a regular article source.

# --- Math / Science ------------------------------------------------------

[[source]]
name = "Quanta Magazine"
section = "Science & Maths"
kind = "rss"
url = "https://www.quantamagazine.org/feed/"
limit = 8

[[source]]
name = "Terence Tao"
section = "Science & Maths"
kind = "rss"
url = "https://terrytao.wordpress.com/feed/"
limit = 5

# --- ML / AI -------------------------------------------------------------

[[source]]
name = "Lil'Log"
section = "Machine Learning"
kind = "rss"
url = "https://lilianweng.github.io/index.xml"
limit = 5

[[source]]
name = "The Gradient"
section = "Machine Learning"
kind = "rss"
url = "https://thegradient.pub/rss/"
limit = 5

# --- Apple ecosystem -----------------------------------------------------

[[source]]
name = "MacRumors"
section = "Apple"
kind = "rss"
url = "https://feeds.macrumors.com/MacRumors-All"
limit = 15

# --- News ----------------------------------------------------------------
# Fast-moving, so each carries a since_hours window: without one, rows already
# in the store keep reappearing in the edition long after they stop being news
# (the window is re-applied at render time, not just at gather time).

[[source]]
name = "The Guardian"
section = "World"
kind = "rss"
url = "https://www.theguardian.com/international/rss"
limit = 8
since_hours = 24

[[source]]
name = "Kyiv Independent"
section = "World"
kind = "rss"
url = "https://kyivindependent.com/news-archive/rss/"
limit = 8
since_hours = 24

[[source]]
name = "Meduza"
section = "World"
kind = "rss"
# Meduza's Russian edition. The LLM stages keep each article's source
# language, so bodies and summaries stay in Russian, like the feed headlines —
# hence the CMU font fallback in the template for Cyrillic.
url = "https://meduza.io/rss/all"
limit = 6
since_hours = 48

# --- Aggregator (last on purpose; mostly social, occasional gems) --------

[[source]]
name = "Hacker News"
section = "Hacker News"
kind = "hn"
limit = 10
since_hours = 48
min_points = 100

