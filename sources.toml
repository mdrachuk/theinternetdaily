# Add, remove, or reorder sources here.
# kind        = "hn" | "rss"    the SOURCE TYPE (tid/sources/). Not a label:
#                               it decides what a record carries beyond the
#                               standard fields, how items are fetched and
#                               parsed, and how an article is shown. An "rss"
#                               article gets one byline chip, its source; an
#                               "hn" story gets two — [Hacker News] for the
#                               discussion, then the site it links to.
# section     = "Science & Maths"   FALLBACK column. The paper's columns are
#                               named per edition by the topics stage, which
#                               reads the day's headlines and files each
#                               article under the topic it is actually about.
#                               This is only what an article falls back to
#                               when that stage did not file it — or what the
#                               whole paper falls back to on a day it could
#                               not run. Sources sharing a section share a
#                               column, and the first four get the front page.
# medium      = "read"|"watch"|"listen"   what the reader does with it. Drives
#                               the glyph in the byline and the
#                               Read/Watch/Listen filter. Defaults to "read".
# since_hours = 24              how far back into the feed a gather reaches.
#                               Omit to take whatever the feed is carrying.
#
# There is no per-source article cap. Every entry a feed has filed since the
# last sync is fetched, rewritten and given its own page; the edition is
# bounded by when the previous one ended, not by a count.
#
# Order matters for the fallback layout: sections appear in the order their
# first source does, and within a section the top article is the newest. When
# the topics stage has run, the columns are its topics instead, ordered by the
# significance it gave them, and each column is led by the main stories it
# picked. Quality first, social last.

# World news (Wikipedia Current events) is rendered inline on page 1 from
# decorations — NOT configured here as a regular article source.

# --- Standing sections ---------------------------------------------------
# The topics stage names the paper's sections per edition by reading the
# day's headlines. The `[[topic]]` tables below are the sections it starts
# from: every edition's topic set contains all of them, and the stage adds the
# day's own topics on top — a story cluster the standing sections do not cover,
# or one big enough to demand a head of its own. An article is filed under the
# MOST SPECIFIC topic, so a standing "World" still yields a "Ukraine" column on
# a day the war dominates; a standing section nothing was filed under simply
# has no column that day. `blurb` is for the editor filing the stories, not
# for the reader: say what belongs in the section. Delete every [[topic]] to
# let the stage name all of the sections itself.

[[topic]]
name = "Ukraine & War"
blurb = "the war in Ukraine, its front, its diplomacy, and other wars"

[[topic]]
name = "russia"
blurb = "Russian politics, society, repression and the economy at home"

[[topic]]
name = "UK"
blurb = "British politics, society and news from the United Kingdom"

[[topic]]
name = "Apple"
blurb = "Apple hardware, software and the ecosystem around it"

[[topic]]
name = "LLMs & AI"
blurb = "language models, AI research, and the industry around them"

