# Add, remove, or reorder sources here.
# kind        = "hn" | "rss"    how the source is fetched (Algolia / feedparser)
# section     = "Science & Maths"   which front-page column the source files
#                               under; sources sharing a section share a
#                               column, and the first four sections get the
#                               front page.
# medium      = "read"|"watch"|"listen"   what the reader does with it. Drives
#                               the glyph in the byline and the
#                               Read/Watch/Listen filter. Defaults to "read".
# since_hours = 24              how far back into the feed a gather reaches.
#                               Omit to take whatever the feed is carrying.
#
# There is no per-source article cap. Every entry a feed has filed since the
# last sync is fetched, rewritten and given its own page; the edition is
# bounded by when the previous one ended, not by a count.
#
# Order matters twice over: sections appear in the order their first source
# does, and within a section the top article is the newest. Quality first,
# social last.

# World news (Wikipedia Current events) is rendered inline on page 1 from
# decorations — NOT configured here as a regular article source.

# --- Math / Science ------------------------------------------------------

[[source]]
name = "Quanta Magazine"
section = "Science & Maths"
kind = "rss"
url = "https://www.quantamagazine.org/feed/"

[[source]]
name = "Terence Tao"
section = "Science & Maths"
kind = "rss"
url = "https://terrytao.wordpress.com/feed/"

# --- ML / AI -------------------------------------------------------------

[[source]]
name = "Lil'Log"
section = "Machine Learning"
kind = "rss"
url = "https://lilianweng.github.io/index.xml"

[[source]]
name = "The Gradient"
section = "Machine Learning"
kind = "rss"
url = "https://thegradient.pub/rss/"

# --- Apple ecosystem -----------------------------------------------------

[[source]]
name = "MacRumors"
section = "Apple"
kind = "rss"
url = "https://feeds.macrumors.com/MacRumors-All"

# --- News ----------------------------------------------------------------
# Fast-moving and deep: each carries a since_hours window so a gather takes
# the day's stories rather than walking back through the whole archive feed.

[[source]]
name = "The Guardian"
section = "World"
kind = "rss"
url = "https://www.theguardian.com/international/rss"
since_hours = 24

[[source]]
name = "Kyiv Independent"
section = "World"
kind = "rss"
url = "https://kyivindependent.com/news-archive/rss/"
since_hours = 24

[[source]]
name = "Meduza"
section = "World"
kind = "rss"
# Meduza's Russian edition. The LLM stages keep each article's source
# language, so bodies and summaries stay in Russian, like the feed headlines —
# hence the CMU font fallback in the template for Cyrillic.
url = "https://meduza.io/rss/all"
since_hours = 48

# --- Aggregator (last on purpose; mostly social, occasional gems) --------

[[source]]
name = "Hacker News"
section = "Hacker News"
kind = "hn"
since_hours = 48
min_points = 100

