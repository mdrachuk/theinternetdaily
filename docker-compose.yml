services:
  tid:
    build: .
    image: tid:latest
    container_name: tid
    restart: unless-stopped
    environment:
      # LLM backend — "anthropic" (default), "vllm", or "ollama".
      # For a local GPU, add the overlay: -f docker-compose.vllm.yml
      - LLM_BACKEND=${LLM_BACKEND:-anthropic}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      # Point these at a vLLM server you run yourself; the overlay sets them
      # for the bundled one.
      - VLLM_BASE_URL=${VLLM_BASE_URL:-}
      - VLLM_MODEL=${VLLM_MODEL:-}
      # `host.docker.internal` reaches an Ollama running on the host. On
      # Docker Desktop (Mac/Windows) this resolves automatically; the
      # extra_hosts entry below is what makes it work on Linux too.
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-mistral}
      # Storage and queue. Defaults: SQLite at /data/state.db and an
      # in-process asyncio queue — no extra services. See
      # docker-compose.mongo.yml / docker-compose.redis.yml to change either.
      - TID_STORE=${TID_STORE:-}
      - TID_QUEUE=${TID_QUEUE:-}
      # Paths inside the container. The image defaults these to /data, so they
      # only need setting to point at a second store — a benchmark run, say.
      - TID_STATE=${TID_STATE:-/data/state.db}
      - TID_CACHE=${TID_CACHE:-/data/archive/cache}
      # Scheduling the edition: INGEST_SCHEDULE (fixed HH:MM times, in
      # INGEST_TIMEZONE) wins over INGEST_INTERVAL_SECONDS when both are set.
      - INGEST_INTERVAL_SECONDS=${INGEST_INTERVAL_SECONDS:-14400}
      - INGEST_SCHEDULE=${INGEST_SCHEDULE:-}
      - INGEST_TIMEZONE=${INGEST_TIMEZONE:-UTC}
      # Between editions the store is filled every hour (gather, summarize,
      # rewrite) so the edition run itself has little left to do. Nothing
      # reaches the site until the edition is assembled. 0 turns it off.
      - PREPARE_INTERVAL_SECONDS=${PREPARE_INTERVAL_SECONDS:-3600}
      - TID_WORKERS=${TID_WORKERS:-8}
      # Hook run after each ingest; receives the new edition snapshot path
      - POST_INGEST_HOOK=${POST_INGEST_HOOK:-}
      - POST_INGEST_HOOK_TIMEOUT=${POST_INGEST_HOOK_TIMEOUT:-300}
    volumes:
      - ./data:/data
      - ./sources.toml:/app/sources.toml:ro
      # rmapi auth token — generate once by running rmapi interactively
      - ${RMAPI_CONFIG:-${HOME}/.config/rmapi}:/root/.config/rmapi:ro
    extra_hosts:
      # Lets `OLLAMA_HOST=http://host.docker.internal:...` work on Linux.
      - "host.docker.internal:host-gateway"
    ports:
      # Default publishes on every interface, as before. Set TID_BIND to
      # 127.0.0.1 when a reverse proxy on the host is the only thing that
      # should reach the app.
      - "${TID_BIND:-0.0.0.0}:8000:8000"
