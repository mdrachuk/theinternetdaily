[project]
name = "papernews"
version = "0.1.0"
description = "Daily news aggregator → LaTeX PDF digest"
requires-python = ">=3.14"
dependencies = [
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "jinja2>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "apscheduler>=3.10",
    "anthropic>=0.40",
    "httpx>=0.27",
]

# LLM backend is selected via LLM_BACKEND ("anthropic", "vllm", or "ollama");
# see papernews/llm.py.

[project.optional-dependencies]
# Optional storage/queue backends. The defaults (SQLite + in-process asyncio)
# need no extra services; these exist for anyone — including a downstream
# multi-user consumer — who wants shared infrastructure.
mongo = ["pymongo>=4.9"]
redis = ["arq>=0.26"]

[project.scripts]
papernews = "papernews.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["papernews"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
